packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^24.19.2
  dotenv: ^18.0.9
  eslint: ^10.14.0
  globals: ^17.14.0
  tsx: ^4.23.15
  typescript: 6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  mongodb-memory-server: true
  prisma: true
  # Its binary arrives as a platform optional dependency; the postinstall is only a fallback.
  workerd: false

# Otherwise the image job's `pnpm --filter server exec` reinstalls, running build scripts beside its Cloudflare secrets.
verifyDepsBeforeRun: false
