packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^24.13.4
  dotenv: ^17.4.2
  eslint: ^10.10.0
  globals: ^17.12.0
  tsx: ^4.23.13
  typescript: 5.9.3
  vitest: ^5.0.5
  zod: ^4.5.4

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  mongodb-memory-server: true
  prisma: true
  # Its binary arrives as a platform optional dependency; the postinstall is only a fallback.
  workerd: false

# Otherwise the image job's `pnpm --filter server exec` reinstalls, running build scripts beside its Cloudflare secrets.
verifyDepsBeforeRun: false

# Released under 24h before the pnpm 12 move; safe to drop after 2026-11-04T12:00Z.
minimumReleaseAgeExclude:
  - miniflare@5.20261103.0-beta
  - wrangler@4.157.0
