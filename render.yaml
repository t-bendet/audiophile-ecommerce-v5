# Render Blueprint - Monorepo Configuration
# https://render.com/docs/blueprint-spec
#
# Deploy: Connect this repo to Render and it will auto-detect this file
# Or manually: render blueprint apply

services:
  # ==============================================
  # Express API Server
  # ==============================================
  - type: web
    name: audiophile-server
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=server...
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24.13.1"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_COOKIE_EXPIRES_IN
        value: "7"

  # ==============================================
  # Old client hostname: redirects to audiophile.t-bendet.com (#208)
  # ==============================================
  - type: web
    name: audiophile-client
    runtime: static
    branch: main
    buildCommand: echo "nothing to build - render/moved is committed"
    staticPublishPath: render/moved
    pullRequestPreviewsEnabled: false
    # Render's rules skip the domain root, so render/moved handles "/"
    routes:
      - type: redirect
        source: "/*"
        destination: "https://audiophile.t-bendet.com/*"
