name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # One group per pull request branch, so a superseded PR push stops early. A push
  # to main has no head_ref, so each gets a group of its own and back-to-back
  # merges run their gates side by side; only Deploy serialises, below (#401).
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Streamed, so each task's lines carry their own timestamps.
  TURBO_LOG_ORDER: stream
  # The registry repository wrangler derives from the Worker name and container class.
  CONTAINER_IMAGE: audiophile-apicontainer

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v7

      - name: Resolve MongoDB version
        id: mongodb
        run: |
          version=$(sed -n 's/^const MONGODB_VERSION = "\(.*\)";$/\1/p' apps/server/test/helpers/global-setup.ts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MONGOMS_VERSION=$version" >> "$GITHUB_ENV"

      # pnpm's version comes from the root package.json `packageManager` field.
      - uses: pnpm/setup@v3
        with:
          install: false
          node-version-file: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        run: bash .github/scripts/assert-node-version.sh

      # A postinstall hook downloads the binary, so restore before install.
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongodb.outputs.version }}

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # One graph: `build` pulls in `db:generate`, so the Prisma client is generated
      # once. A failed task stops only the tasks that depend on it.
      - run: pnpm turbo run build lint type-check test --continue=dependencies-successful
        timeout-minutes: 10

      - run: pnpm format:check

      - run: pnpm docs:check

      # Deploy restores this; Verify and E2E restore nothing, so every check runs.
      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # PRs build and discard. Main's run tags the image by the hash of its inputs and
  # hands Deploy the registry digest behind that tag, so Deploy never builds (#392).
  # When the registry already holds the tag, nothing is built or pushed and the
  # deploy carries no container change, so no rollout starts (#397).
  image:
    name: Server image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      digest: ${{ steps.lookup.outputs.digest || steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The repo's turbo and wrangler, for the hash, the lookup and the push; the
      # steps that carry this `if` do not run on a pull request.
      - uses: pnpm/setup@v3
        if: github.event_name == 'push'
        with:
          install: false
          node-version-file: false

      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter server --filter .
        if: github.event_name == 'push'
        env:
          # No test runs here, so the binary download is dead weight.
          MONGOMS_DISABLE_POSTINSTALL: "1"
        timeout-minutes: 10

      # Everything the build reads: the Dockerfile's `pruner` stage output,
      # `.dockerignore` and the base image's manifest digest (so a base refresh
      # still ships). Fixed tar metadata, so only content counts.
      - name: Hash the image's inputs
        id: inputs
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          pnpm exec turbo prune server --docker --out-dir "$RUNNER_TEMP/prune"
          base_image=$(sed -n 's/^FROM \(.*\) AS base$/\1/p' apps/server/Dockerfile)
          test -n "$base_image"
          base_digest=$(docker buildx imagetools inspect "$base_image" --format '{{.Manifest.Digest}}')
          echo "$base_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          tag=$(tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cf - -C "$RUNNER_TEMP/prune" . -C "$GITHUB_WORKSPACE" .dockerignore \
            | cat - <(printf '%s' "$base_digest") | sha256sum | cut -c1-16)
          echo "$base_image is $base_digest; the image's inputs hash to $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # An empty digest means the tag is new and the build below runs.
      - name: Look the tag up in the Cloudflare registry
        id: lookup
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -o pipefail
          digest=$(node .github/scripts/resolve-image-digests.mjs "$TAG" | cut -f2)
          if [ "$digest" = "-" ]; then
            echo "::notice::$CONTAINER_IMAGE:$TAG is not in the registry; building and pushing it"
            digest=''
          else
            echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "::notice::$CONTAINER_IMAGE:$TAG is already in the registry as $digest; no build, no push"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Main's run seeds the cache PRs restore from; PRs write none (#391). The
      # platform and provenance settings match wrangler's own build.
      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request' || steps.lookup.outputs.digest == ''
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: ${{ github.event_name == 'push' }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ steps.inputs.outputs.tag || github.sha }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # `docker push` records the registry digest on the local image; the digest
      # alone is the output, because an output holding the account id (a secret)
      # would be dropped.
      - name: Push the image to the Cloudflare registry
        id: push
        if: github.event_name == 'push' && steps.lookup.outputs.digest == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          pnpm --filter server exec wrangler containers push "$CONTAINER_IMAGE:$TAG"
          reference=$(docker image inspect --format '{{ index .RepoDigests 0 }}' \
            "registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$CONTAINER_IMAGE:$TAG")
          digest="${reference#*@}"
          echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "pushed $CONTAINER_IMAGE:$TAG as $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        timeout-minutes: 10

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/audiophile-e2e?replicaSet=rs0&directConnection=true
      # No vitest runs here, so the binary download is dead weight.
      MONGOMS_DISABLE_POSTINSTALL: "1"

    steps:
      - uses: actions/checkout@v7

      # `pnpm db:up` before pnpm exists, in the background so the image pull and
      # replica-set init overlap the install and build.
      - name: Start MongoDB in the background
        run: |
          docker compose up -d --wait > "$RUNNER_TEMP/db-up.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/db-up.pid"

      - uses: pnpm/setup@v3
        with:
          install: false
          node-version-file: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        run: bash .github/scripts/assert-node-version.sh

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # `build` pulls in `db:generate`.
      - run: pnpm build

      # The idempotent `db:up` then reports a failed background start.
      - name: Wait for MongoDB
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/db-up.pid")" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/db-up.log"
          pnpm db:up
        timeout-minutes: 5

      # The seed drops the database, so the push that rebuilds its indexes comes second.
      - run: pnpm db:seed && pnpm db:push

      # The headless shell is all a headless run without `channel` uses; restoring a
      # browser cache costs as much as downloading.
      - run: pnpm --filter e2e exec playwright install chromium --only-shell --with-deps

      - run: pnpm --filter e2e run e2e

      # A green run's report is worth keeping too; a cancelled one has nothing in it.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: [verify, image, e2e]
    runs-on: ubuntu-latest
    # One deploy runs and one waits; a newer run's deploy replaces the waiting one.
    # The sync steps are this job's tail, so the group covers them too.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      # No test runs here, so the binary download is dead weight.
      MONGOMS_DISABLE_POSTINSTALL: "1"

    # The Cloudflare secrets sit on the wrangler steps (the account id also on the
    # config writer) and the Atlas one on the sync steps, so neither process sees
    # the other's credential.
    steps:
      # The group does not order its queue, so a run that main has moved past skips
      # every step below (each carries the `if`) and the newer run deploys. Nothing
      # is checked out yet, so the public repo is asked directly; a prompt fails fast.
      - name: Check this commit is still the head of main
        id: guard
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1) || head=''
          if ! echo "$head" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::could not read the head of main (got '$head'); refusing to decide whether to deploy"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA is the head of main; deploying."
            echo "head_of_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::superseded by $head; the newer run deploys"
            echo "head_of_main=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.head_of_main == 'true'

      - uses: pnpm/setup@v3
        if: steps.guard.outputs.head_of_main == 'true'
        with:
          install: false
          node-version-file: false

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.head_of_main == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        if: steps.guard.outputs.head_of_main == 'true'
        run: bash .github/scripts/assert-node-version.sh

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.head_of_main == 'true'
        timeout-minutes: 10

      # A bad token fails here, in seconds, before the Worker upload.
      - run: pnpm --filter server exec wrangler whoami
        if: steps.guard.outputs.head_of_main == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The image the container runs before this deploy; the prune at the end
      # keeps it. Empty on a fresh account, where no application exists yet.
      - name: Record the image the container runs
        id: running
        if: steps.guard.outputs.head_of_main == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          image=$(pnpm --filter server exec wrangler containers list --json \
            | jq -r --arg name "$CONTAINER_IMAGE" '.[] | select(.name == $name) | .image // empty')
          digest="${image#*@}"
          if [ -z "$image" ]; then
            echo "::notice::no $CONTAINER_IMAGE application yet"
          else
            echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "the container runs $digest"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify's build outputs, this commit's entry first; `db:generate` and `deploy:ci` never cache.
      - uses: actions/cache/restore@v6
        if: steps.guard.outputs.head_of_main == 'true'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # wrangler.jsonc with the container pointed at the image this run pushed or found.
      - name: Write the CI deploy config
        if: steps.guard.outputs.head_of_main == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: node .github/scripts/write-ci-wrangler-config.mjs

      # Prisma client, client build, then `wrangler deploy`: Worker, assets and the
      # container application; no Docker here.
      - name: Deploy the Worker
        if: steps.guard.outputs.head_of_main == 'true'
        run: pnpm turbo run deploy:ci --filter=server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 30

      # The catalogue the repo owns, onto Atlas, once the new server is live. The
      # sync is insert-only: a document whose unique key is missing is created and
      # an existing one is left alone, so an admin's edits survive (ADR 0007). The
      # overwrite flag is never passed here. No drop, no delete, no user touched.
      # The index push that follows changes indexes only, never documents.
      # Without the secret the catalogue is still reseeded by hand, so say so
      # rather than failing a deploy that otherwise succeeded.
      - name: Check for the Atlas connection string
        id: secret
        if: steps.guard.outputs.head_of_main == 'true'
        env:
          ATLAS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$ATLAS_DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set; skipping the catalogue sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the catalogue
        if: steps.guard.outputs.head_of_main == 'true' && steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:generate && pnpm db:sync
        timeout-minutes: 10

      # `db:indexes` refuses to push while duplicates exist. The variable opts
      # in once Atlas has none, because push builds indexes one by one and
      # stops at the first failure.
      - name: Check the schema index opt-in
        id: indexes
        if: steps.guard.outputs.head_of_main == 'true' && steps.secret.outputs.present == 'true'
        run: |
          if [ "$SYNC_SCHEMA_INDEXES" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SYNC_SCHEMA_INDEXES is not true; skipping the schema index push."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SYNC_SCHEMA_INDEXES: ${{ vars.SYNC_SCHEMA_INDEXES }}

      # `pnpm db:indexes`, split so push's output is withheld on failure: an
      # E11000 message carries the duplicate key value, and this log is public.
      - name: Push the schema's indexes
        if: steps.guard.outputs.head_of_main == 'true' && steps.indexes.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm db:indexes:check
          if pnpm --filter @repo/database exec prisma db push --skip-generate > "$RUNNER_TEMP/push.log" 2>&1; then
            cat "$RUNNER_TEMP/push.log"
          else
            echo "::error::prisma db push failed after the duplicate check passed; its output is withheld because it can contain key values. Rerun pnpm db:indexes:check, resolve what it reports, then rerun this job."
            exit 1
          fi
        timeout-minutes: 10

      # Registry housekeeping, reached only once the deploy and the sync steps
      # succeeded. Keeps the image the container ran before this deploy, the one
      # this run deployed and the one the application reports now; lists every
      # other tag and, with the variable set, deletes them. A newer push's image
      # job may already have pushed a tag this run would not keep, so the delete
      # is skipped as soon as main has moved on.
      - name: Plan the registry prune
        id: plan
        if: steps.guard.outputs.head_of_main == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_DIGEST: ${{ steps.running.outputs.digest }}
          DEPLOYED_DIGEST: ${{ needs.image.outputs.digest }}
          REGISTRY_PRUNE: ${{ vars.REGISTRY_PRUNE }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -o pipefail
          image=$(pnpm --filter server exec wrangler containers list --json \
            | jq -r --arg name "$CONTAINER_IMAGE" '.[] | select(.name == $name) | .image // empty')
          current="${image#*@}"
          if [ "$current" = "$DEPLOYED_DIGEST" ]; then
            echo "the container runs the deployed image $current"
          else
            echo "::warning::the container reports $current, this deploy wrote $DEPLOYED_DIGEST"
          fi
          pnpm --filter server exec wrangler containers images list --json \
            | jq -r --arg name "$CONTAINER_IMAGE" '.[] | select(.name == $name) | .tags[]' > "$RUNNER_TEMP/tags.txt"
          mapfile -t tags < "$RUNNER_TEMP/tags.txt"
          : > "$RUNNER_TEMP/tags.tsv"
          if [ "${#tags[@]}" -gt 0 ]; then
            node .github/scripts/resolve-image-digests.mjs "${tags[@]}" > "$RUNNER_TEMP/tags.tsv"
          fi
          keep=" $PREVIOUS_DIGEST $DEPLOYED_DIGEST $current "
          : > "$RUNNER_TEMP/delete.txt"
          while IFS=$'\t' read -r tag digest; do
            case "$digest" in
              -) echo "gone    $CONTAINER_IMAGE:$tag" ;;
              *) case "$keep" in
                   *" $digest "*) echo "keep    $CONTAINER_IMAGE:$tag  $digest" ;;
                   *) echo "delete  $CONTAINER_IMAGE:$tag  $digest"; echo "$tag" >> "$RUNNER_TEMP/delete.txt" ;;
                 esac ;;
            esac
          done < "$RUNNER_TEMP/tags.tsv"
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$REGISTRY_PRUNE" != "true" ]; then
            echo "::warning::REGISTRY_PRUNE is not true; the listing above is what a prune would delete. Nothing was deleted."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; its deploy prunes. Nothing was deleted."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        timeout-minutes: 5

      - name: Prune the registry
        if: steps.guard.outputs.head_of_main == 'true' && steps.plan.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          while read -r tag; do
            pnpm --filter server exec wrangler containers images delete "$CONTAINER_IMAGE:$tag" < /dev/null
          done < "$RUNNER_TEMP/delete.txt"
        timeout-minutes: 10
