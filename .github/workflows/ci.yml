name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes stop early; pushes to main keep their status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v7

      - name: Resolve MongoDB version
        id: mongodb
        run: |
          version=$(sed -n 's/^const MONGODB_VERSION = "\(.*\)";$/\1/p' apps/server/test/helpers/global-setup.ts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MONGOMS_VERSION=$version" >> "$GITHUB_ENV"

      # pnpm's version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # A postinstall hook downloads the binary, so restore before install.
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongodb.outputs.version }}

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # The Prisma client is generated, not committed.
      - run: pnpm db:generate

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test
        timeout-minutes: 10

      - run: pnpm format:check

  image:
    name: Server image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the image the container Worker deploys; nothing is pushed. Main's run seeds the cache PRs restore from.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: [verify, image]
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      # No test runs here, so the binary download is dead weight.
      MONGOMS_DISABLE_POSTINSTALL: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # A bad token fails here, in seconds, not after the image build.
      - run: pnpm --filter server exec wrangler whoami

      # Builds everything, then `wrangler deploy`: image, Worker and assets.
      - run: pnpm deploy:app
        timeout-minutes: 30

  # The catalogue the repo owns, onto Atlas, once the new server is live. Every
  # write is an upsert on a unique key: no drop, no delete, no user touched.
  sync-catalogue:
    name: Sync catalogue
    if: github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      ATLAS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGOMS_DISABLE_POSTINSTALL: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # Without the secret the catalogue is still reseeded by hand, so say so
      # rather than failing a deploy that otherwise succeeded.
      - name: Check for the Atlas connection string
        id: secret
        run: |
          if [ -z "$ATLAS_DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set; skipping the catalogue sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the catalogue
        if: steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:generate && pnpm db:sync
        timeout-minutes: 10
