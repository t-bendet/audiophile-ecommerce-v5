name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes stop early; pushes to main keep their status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Streamed, so each task's lines carry their own timestamps.
  TURBO_LOG_ORDER: stream
  # The registry repository wrangler derives from the Worker name and container class.
  CONTAINER_IMAGE: audiophile-apicontainer

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v7

      - name: Resolve MongoDB version
        id: mongodb
        run: |
          version=$(sed -n 's/^const MONGODB_VERSION = "\(.*\)";$/\1/p' apps/server/test/helpers/global-setup.ts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MONGOMS_VERSION=$version" >> "$GITHUB_ENV"

      # pnpm's version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        run: bash .github/scripts/assert-node-version.sh

      # A postinstall hook downloads the binary, so restore before install.
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongodb.outputs.version }}

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # One graph: `build` pulls in `db:generate`, so the Prisma client is generated
      # once. A failed task stops only the tasks that depend on it.
      - run: pnpm turbo run build lint type-check test --continue=dependencies-successful
        timeout-minutes: 10

      - run: pnpm format:check

      - run: pnpm docs:check

      # Deploy restores this; Verify and E2E restore nothing, so every check runs.
      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # PRs build and discard. Main's run also loads the image, pushes it to the
  # Cloudflare registry and hands Deploy its digest, so Deploy never builds (#392).
  image:
    name: Server image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Main's run seeds the cache PRs restore from; PRs write none (#391). The
      # platform and provenance settings match wrangler's own build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: ${{ github.event_name == 'push' }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # The repo's wrangler, for the push; nothing below runs on a pull request.
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'push'

      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter server
        if: github.event_name == 'push'
        env:
          # No test runs here, so the binary download is dead weight.
          MONGOMS_DISABLE_POSTINSTALL: "1"
        timeout-minutes: 10

      # `docker push` records the registry digest on the local image; the digest
      # alone is the output, because an output holding the account id (a secret)
      # would be dropped.
      - name: Push the image to the Cloudflare registry
        id: push
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter server exec wrangler containers push "$CONTAINER_IMAGE:$GITHUB_SHA"
          reference=$(docker image inspect --format '{{ index .RepoDigests 0 }}' \
            "registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$CONTAINER_IMAGE:$GITHUB_SHA")
          digest="${reference#*@}"
          echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        timeout-minutes: 10

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/audiophile-e2e?replicaSet=rs0&directConnection=true
      # No vitest runs here, so the binary download is dead weight.
      MONGOMS_DISABLE_POSTINSTALL: "1"

    steps:
      - uses: actions/checkout@v7

      # `pnpm db:up` before pnpm exists, in the background so the image pull and
      # replica-set init overlap the install and build.
      - name: Start MongoDB in the background
        run: |
          docker compose up -d --wait > "$RUNNER_TEMP/db-up.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/db-up.pid"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        run: bash .github/scripts/assert-node-version.sh

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # `build` pulls in `db:generate`.
      - run: pnpm build

      # The idempotent `db:up` then reports a failed background start.
      - name: Wait for MongoDB
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/db-up.pid")" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/db-up.log"
          pnpm db:up
        timeout-minutes: 5

      # The seed drops the database, so the push that rebuilds its indexes comes second.
      - run: pnpm db:seed && pnpm db:push

      # The headless shell is all a headless run without `channel` uses; restoring a
      # browser cache costs as much as downloading.
      - run: pnpm --filter e2e exec playwright install chromium --only-shell --with-deps

      - run: pnpm --filter e2e run e2e

      # A green run's report is worth keeping too; a cancelled one has nothing in it.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: [verify, image, e2e]
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it; nothing here connects.
      DATABASE_URL: mongodb://localhost:27017/audiophile
      # No test runs here, so the binary download is dead weight.
      MONGOMS_DISABLE_POSTINSTALL: "1"

    # The Cloudflare secrets sit on the wrangler steps (the account id also on the
    # config writer) and the Atlas one on the sync steps, so neither process sees
    # the other's credential.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Assert Node matches .nvmrc
        run: bash .github/scripts/assert-node-version.sh

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # A bad token fails here, in seconds, before the Worker upload.
      - run: pnpm --filter server exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Verify's build outputs, this commit's entry first; `db:generate` and `deploy:ci` never cache.
      - uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # wrangler.jsonc with the container pointed at the image this run pushed.
      - name: Write the CI deploy config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: node .github/scripts/write-ci-wrangler-config.mjs

      # Prisma client, client build, then `wrangler deploy`: Worker, assets and the
      # container application; no Docker here.
      - name: Deploy the Worker
        run: pnpm turbo run deploy:ci --filter=server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 30

      # The catalogue the repo owns, onto Atlas, once the new server is live. The
      # sync is insert-only: a document whose unique key is missing is created and
      # an existing one is left alone, so an admin's edits survive (ADR 0007). The
      # overwrite flag is never passed here. No drop, no delete, no user touched.
      # The index push that follows changes indexes only, never documents.
      # Without the secret the catalogue is still reseeded by hand, so say so
      # rather than failing a deploy that otherwise succeeded.
      - name: Check for the Atlas connection string
        id: secret
        env:
          ATLAS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$ATLAS_DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set; skipping the catalogue sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the catalogue
        if: steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:generate && pnpm db:sync
        timeout-minutes: 10

      # `db:indexes` refuses to push while duplicates exist. The variable opts
      # in once Atlas has none, because push builds indexes one by one and
      # stops at the first failure.
      - name: Check the schema index opt-in
        id: indexes
        if: steps.secret.outputs.present == 'true'
        run: |
          if [ "$SYNC_SCHEMA_INDEXES" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SYNC_SCHEMA_INDEXES is not true; skipping the schema index push."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SYNC_SCHEMA_INDEXES: ${{ vars.SYNC_SCHEMA_INDEXES }}

      # `pnpm db:indexes`, split so push's output is withheld on failure: an
      # E11000 message carries the duplicate key value, and this log is public.
      - name: Push the schema's indexes
        if: steps.indexes.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm db:indexes:check
          if pnpm --filter @repo/database exec prisma db push --skip-generate > "$RUNNER_TEMP/push.log" 2>&1; then
            cat "$RUNNER_TEMP/push.log"
          else
            echo "::error::prisma db push failed after the duplicate check passed; its output is withheld because it can contain key values. Rerun pnpm db:indexes:check, resolve what it reports, then rerun this job."
            exit 1
          fi
        timeout-minutes: 10
